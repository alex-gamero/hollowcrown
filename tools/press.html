<!doctype html><html><head><style>
body { margin: 0; background: #000; }
</style></head><body>
<canvas id="banner" width="960" height="300"></canvas><canvas id="cover" width="630" height="500"></canvas><canvas id="bg" width="128" height="128"></canvas>
<script src="../src/engine/core.js"></script><script src="../src/engine/sprites.js"></script><script src="../src/engine/font.js"></script>
<script src="../src/art/characters.js"></script><script src="../src/art/monsters.js"></script><script src="../src/art/logo.js"></script>
<script>
// Store art for itch.io, drawn at full resolution: smooth light, crisp pixel-art sprites and the game font.
const px = (ctx, img, x, y, s) => { ctx.imageSmoothingEnabled = false; ctx.drawImage(img, Math.round(x), Math.round(y), img.width * s, img.height * s); };

function sky(ctx, W, H) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04020a'); g.addColorStop(0.55, '#140a22'); g.addColorStop(1, '#2a1430');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = HC.makeRng(11);
  for (let i = 0; i < W * H / 900; i++) {
    const x = r() * W, y = r() * H * 0.8, b = r();
    ctx.fillStyle = b > 0.9 ? 'rgba(255,240,200,0.9)' : 'rgba(170,150,210,' + (0.25 + b * 0.4) + ')';
    ctx.fillRect(Math.round(x), Math.round(y), b > 0.95 ? 2 : 1, b > 0.95 ? 2 : 1);
  }
}
// soft golden light with rays
function sunGlow(ctx, cx, cy, r) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(255,214,110,0.55)'); g.addColorStop(0.25, 'rgba(240,150,50,0.32)'); g.addColorStop(0.6, 'rgba(160,60,40,0.14)'); g.addColorStop(1, 'rgba(60,10,30,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.13, len = r * (i % 2 ? 1.05 : 1.4), w = i % 2 ? 0.05 : 0.08;
    const rg = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, len);
    rg.addColorStop(0, 'rgba(255,220,130,0.32)'); rg.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, len, a - w, a + w); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function haze(ctx, W, y, h, color) {
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, color);
  ctx.fillStyle = g; ctx.fillRect(0, y, W, h);
}
// pixel-art castle silhouette, drawn small then scaled up crisp
function castleCanvas(seed) {
  const [c, ctx] = HC.makeCanvas(240, 140), rng = HC.makeRng(seed), wall = '#0b0714', rim = '#c08030';
  ctx.fillStyle = wall; ctx.fillRect(10, 70, 220, 70);
  for (let x = 10; x < 230; x += 8) ctx.fillRect(x, 66, 5, 4);
  const tower = (x, w, h, roof) => {
    const y = 140 - h; ctx.fillStyle = wall; ctx.fillRect(x, y, w, h); ctx.fillStyle = rim; ctx.fillRect(x, y, 1, h);
    if (roof) { for (let j = 0; j < roof; j++) { const ww = Math.round((w + 4) * (1 - j / roof)); ctx.fillStyle = wall; ctx.fillRect(Math.round(x + w / 2 - ww / 2), y - j, ww, 1); } ctx.fillStyle = rim; ctx.fillRect(Math.round(x + w / 2), y - roof - 3, 1, 4); }
    else for (let xx = x; xx < x + w; xx += 4) { ctx.fillStyle = wall; ctx.fillRect(xx, y - 3, 2, 3); }
    for (let n = 0; n < Math.floor(h / 20); n++) if (rng() < 0.6) { ctx.fillStyle = rng() < 0.5 ? '#ffb040' : '#a05a20'; ctx.fillRect(Math.round(x + w / 2 - 1), y + 10 + n * 20, 2, 4); }
  };
  tower(0, 18, 92, 24); tower(30, 14, 70, 0); tower(62, 22, 120, 30); tower(154, 22, 112, 28); tower(194, 14, 76, 0); tower(222, 18, 98, 26);
  ctx.fillStyle = wall; ctx.fillRect(94, 8, 52, 132);
  [[0, 8], [8, 14], [16, 6], [24, 18], [32, 7], [40, 12], [48, 4]].forEach(([x, h]) => ctx.fillRect(94 + x, 8 - h, 4, h + 1));
  ctx.fillStyle = rim; ctx.fillRect(94, 8, 1, 132);
  ctx.fillStyle = '#04020a'; ctx.fillRect(108, 106, 24, 34);
  ctx.fillStyle = '#ff2a3c'; ctx.fillRect(116, 116, 1, 1); ctx.fillRect(122, 116, 1, 1);
  return c;
}
// Title and tagline use the game's own 5x7 pixel font, scaled by whole numbers so every pixel stays sharp.
function pixelText(text, scale, bands, outline) {
  const w = HC.font.measure(text) + 4, h = 11;
  const [c, t] = HC.makeCanvas(w, h);
  if (outline) [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1], [2, 2]].forEach(([dx, dy]) => HC.font.draw(t, text, 2 + dx, 2 + dy, outline));
  const [m, mt] = HC.makeCanvas(w, h, true); HC.font.draw(mt, text, 2, 2, '#ffffff');
  const id = mt.getImageData(0, 0, w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4; if (id.data[i + 3] < 128) continue;
    const col = HC.hex(bands[Math.max(0, Math.min(bands.length - 1, y - 2))]);
    id.data[i] = col[0]; id.data[i + 1] = col[1]; id.data[i + 2] = col[2]; id.data[i + 3] = 255;
  }
  mt.putImageData(id, 0, 0);
  t.drawImage(m, 0, 0);
  const [big, bt] = HC.makeCanvas(w * scale, h * scale);
  bt.imageSmoothingEnabled = false; bt.drawImage(c, 0, 0, w * scale, h * scale);
  return big;
}
function title(ctx, text, cx, y, scale) {
  const img = pixelText(text, scale, ['#fff6c8', '#ffeaa0', '#ffd650', '#ffd650', '#f0b030', '#d08a20', '#a8601a'], '#2a1206');
  ctx.save(); ctx.imageSmoothingEnabled = false;
  ctx.shadowColor = 'rgba(255,170,60,0.7)'; ctx.shadowBlur = scale * 4;
  ctx.drawImage(img, Math.round(cx - img.width / 2), Math.round(y - img.height / 2));
  ctx.shadowBlur = 0; ctx.drawImage(img, Math.round(cx - img.width / 2), Math.round(y - img.height / 2));
  ctx.restore();
}
function tagline(ctx, text, cx, y, scale) {
  const img = pixelText(text, scale, Array(7).fill('#f0e0c0'), '#06030a');
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(img, Math.round(cx - img.width / 2), Math.round(y - img.height / 2)); ctx.restore();
}

Promise.resolve().then(() => {
  // ---- banner 960x300 ----
  {
    const ctx = document.getElementById('banner').getContext('2d'), W = 960, H = 300;
    sky(ctx, W, H);
    sunGlow(ctx, 130, 140, 250);
    px(ctx, castleCanvas(3), 735, 168, 1);
    haze(ctx, W, 210, 90, 'rgba(10,5,16,0.95)');
    ctx.fillStyle = '#06030a'; for (let x = 0; x < W; x += 2) { const h = 284 + Math.round(Math.sin(x * 0.012) * 6 + Math.sin(x * 0.05) * 2); ctx.fillRect(x, h, 2, 40); }
    const sun = HC.art.sun.glow; px(ctx, sun, 130 - sun.width * 1.5, 140 - sun.height * 1.5, 3);
    title(ctx, 'HOLLOWCROWN', 545, 124, 8);
    tagline(ctx, 'A PRINCESS OF LIGHT. A CASTLE THAT FORGOT THE SUN.', 545, 182, 2);
  }
  // ---- cover 630x500: just the sun, on a transparent background ----
  {
    const ctx = document.getElementById('cover').getContext('2d'), W = 630, H = 500;
    ctx.imageSmoothingEnabled = false;
    const sun = HC.art.sun.glow; ctx.drawImage(sun, Math.round(W / 2 - sun.width * 3), Math.round(H / 2 - sun.height * 3), sun.width * 6, sun.height * 6);
  }
  // ---- background tile 128x128: dark bricks with golden glints ----
  {
    const [c, t] = HC.makeCanvas(64, 64);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      const row = Math.floor(y / 8), off = row & 1 ? 8 : 0, rx = (x + off) % 16, ry = y % 8;
      const r = HC.makeRng(Math.floor((x + off) / 16) * 31 + row * 7)();
      let col = HC.hex('#160e1f').map((v, i) => v * (0.85 + r * 0.3) + (r > 0.8 ? [14, 7, 0][i] : 0));
      if (ry === 7 || rx === 15) col = HC.hex('#0a060e');
      else if (ry === 0) col = r > 0.6 ? HC.hex('#3a2616') : HC.hex('#221830');
      t.fillStyle = HC.rgb(col); t.fillRect(x, y, 1, 1);
    }
    const gl = HC.makeRng(5);
    for (let i = 0; i < 14; i++) { t.fillStyle = gl() < 0.4 ? '#ffd650' : '#a0681c'; t.fillRect(gl.int(0, 63), gl.int(0, 63), 1, 1); }
    px(document.getElementById('bg').getContext('2d'), c, 0, 0, 2);
  }
  window.__done = true;
});
</script></body></html>
