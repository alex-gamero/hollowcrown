<!doctype html><html><body style="margin:0;background:#000">
<canvas id="banner" width="480" height="150"></canvas><canvas id="cover" width="315" height="250"></canvas><canvas id="bg" width="96" height="96"></canvas>
<script src="../src/engine/core.js"></script><script src="../src/engine/sprites.js"></script><script src="../src/engine/font.js"></script>
<script src="../src/art/characters.js"></script><script src="../src/art/monsters.js"></script><script src="../src/art/logo.js"></script>
<script>
// Store art for itch.io: banner, cover and a background tile, all drawn with the game's own pixel art.
const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const th = (x, y) => (B[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
function sky(ctx, W, H, horizon) {
  const top = HC.hex('#05030b'), hor = HC.hex('#2a1634');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = Math.min(1, y / horizon) ** 1.5, band = Math.floor(t * 6), f = t * 6 - band;
    const tt = (band + (f > th(x, y) ? 1 : 0)) / 6;
    ctx.fillStyle = HC.rgb(top.map((v, i) => v + (hor[i] - v) * tt)); ctx.fillRect(x, y, 1, 1);
  }
  const rng = HC.makeRng(7);
  for (let i = 0; i < W * H / 180; i++) { ctx.fillStyle = rng() < 0.25 ? '#a898c8' : '#3a3050'; ctx.fillRect(rng.int(0, W), rng.int(0, horizon), 1, 1); }
}
// golden glow: opaque dithered bands of warm light with long rays
function glow(ctx, cx, cy, r, W, H) {
  const bands = ['#2a1430', '#3a1c2a', '#5a2a22', '#8a4a1c', '#c07a24', '#f0b040'];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) / r;
    const ang = Math.atan2(dy, dx), ray = Math.pow(0.5 + 0.5 * Math.cos(ang * 10), 6);
    let v = Math.max(0, 1 - d) ** 1.4 * 1.05 + Math.max(0, 1 - d / 2.2) ** 2 * ray * 0.55;
    if (v <= 0.02) continue;
    const k = v * bands.length, i = Math.floor(k), f = k - i;
    const idx = Math.min(bands.length - 1, i + (f > th(x, y) ? 1 : 0)) - 1;
    if (idx < 0) continue;
    ctx.fillStyle = bands[idx]; ctx.fillRect(x, y, 1, 1);
  }
}
function clouds(ctx, W, list, sunX, sunY) {
  list.forEach(([cx, cy, w, h]) => {
    for (let y = cy - h; y < cy + h; y++) for (let x = cx - w; x < cx + w; x++) {
      const d = ((x - cx) / w) ** 2 + ((y - cy) / h) ** 2;
      if (d > 1 || d > 0.6 + th(x, y) * 0.4) continue;
      const lit = Math.max(0, 1 - Math.hypot(x - sunX, y - sunY) / 220);
      const top = y < cy - h * 0.3;
      ctx.fillStyle = top ? (lit > 0.5 ? '#d08a30' : lit > 0.25 ? '#8a4a2a' : '#4a2a3a') : (lit > 0.4 ? '#5a2a2a' : '#2a1626');
      ctx.fillRect(x, y, 1, 1);
    }
  });
}
function castle(ctx, W, base, scale, rngSeed, centerX) {
  const rng = HC.makeRng(rngSeed), wall = '#0d0818', rim = '#b0702a', cx = (centerX || W / 2), s = scale;
  ctx.fillStyle = '#120a1e';
  for (let x = 0; x < W; x++) { const h = base - 10 * s - Math.round(Math.sin(x * 0.02 / s + 1) * 6 * s + Math.sin(x * 0.05 / s) * 3 * s); ctx.fillRect(x, h, 1, 300); }
  ctx.fillStyle = wall; ctx.fillRect(cx - 110 * s, base - 70 * s, 220 * s, 300);
  for (let x = cx - 110 * s; x < cx + 110 * s; x += 8 * s) ctx.fillRect(x, base - 74 * s, 5 * s, 4 * s);
  const tower = (x, w, h, roof) => {
    x = cx + x * s; w *= s; h *= s; roof *= s; const y = base - h;
    ctx.fillStyle = wall; ctx.fillRect(x, y, w, 300); ctx.fillStyle = rim; ctx.fillRect(x, y, 1, h);
    if (roof) { for (let j = 0; j < roof; j++) { const ww = Math.round((w + 4 * s) * (1 - j / roof)); ctx.fillStyle = wall; ctx.fillRect(Math.round(x + w / 2 - ww / 2), y - j, ww, 1); } ctx.fillStyle = rim; ctx.fillRect(Math.round(x + w / 2), y - roof - 3 * s, 1, 4 * s); }
    else for (let xx = x; xx < x + w; xx += 4 * s) { ctx.fillStyle = wall; ctx.fillRect(xx, y - 3 * s, 2 * s, 3 * s); }
    for (let n = 0; n < Math.floor(h / (20 * s)); n++) if (rng() < 0.6) { ctx.fillStyle = rng() < 0.4 ? '#e09030' : '#8a4a20'; ctx.fillRect(Math.round(x + w / 2 - s), y + 10 * s + n * 20 * s, 2 * s, 4 * s); }
  };
  tower(-122, 18, 92, 24); tower(-90, 14, 70, 0); tower(-58, 22, 120, 30); tower(36, 22, 112, 28); tower(76, 14, 76, 0); tower(104, 18, 98, 26);
  ctx.fillStyle = wall; ctx.fillRect(cx - 26 * s, base - 132 * s, 52 * s, 300);
  [[0, 8], [8, 14], [16, 6], [24, 18], [32, 7], [40, 12], [48, 4]].forEach(([x, h]) => ctx.fillRect(cx - 26 * s + x * s, base - 132 * s - h * s, 4 * s, h * s));
  ctx.fillStyle = rim; ctx.fillRect(cx - 26 * s, base - 132 * s, 1, 132 * s);
  ctx.fillStyle = '#05030a'; ctx.fillRect(cx - 12 * s, base - 34 * s, 24 * s, 300);
  ctx.fillStyle = '#ff2a3c'; ctx.fillRect(cx - 3 * s, base - 24 * s, 1, 1); ctx.fillRect(cx + 2 * s, base - 24 * s, 1, 1);
}
function princess(ctx, x, y, scale) {
  const s = HC.art.princess.up[0];
  ctx.drawImage(s.base, Math.round(x - s.w * scale / 2), Math.round(y - s.h * scale), s.w * scale, s.h * scale);
}
function ground(ctx, W, H, y0) {
  ctx.fillStyle = '#07040c'; ctx.fillRect(0, y0, W, H - y0);
  for (let y = y0; y < H; y++) { const w = 20 + (y - y0) * 2.2; for (let x = Math.round(W / 2 - w / 2); x < W / 2 + w / 2; x++) if (((x >> 1) + (y >> 1)) & 1) { ctx.fillStyle = '#18102a'; ctx.fillRect(x, y, 1, 1); } }
}
function motes(ctx, cx, cy, n, spread, seed) {
  const r = HC.makeRng(seed);
  for (let i = 0; i < n; i++) { ctx.fillStyle = r() < 0.5 ? '#fff7d0' : '#ffd650'; ctx.fillRect(Math.round(cx + (r() - 0.5) * spread), Math.round(cy - r() * spread * 0.8), 1, 1); }
}
function eyes(ctx, pts) { ctx.fillStyle = '#ff2a3c'; pts.forEach(([x, y]) => { ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + 3, y, 1, 1); }); }

// ---- banner 480x150 (shown at 960x300) ----
{
  const c = document.getElementById('banner'), ctx = c.getContext('2d'), W = 480, H = 150;
  sky(ctx, W, H, 140);
  glow(ctx, 70, 66, 90, W, H);
  clouds(ctx, W, [[150, 104, 70, 6], [40, 122, 60, 5], [300, 112, 60, 5], [220, 128, 80, 6]], 70, 66);
  castle(ctx, W, 158, 0.58, 3, 400);
  ctx.fillStyle = '#07040c'; for (let x = 0; x < W; x++) { const h = 142 + Math.round(Math.sin(x * 0.03) * 3); ctx.fillRect(x, h, 1, 20); }
  HC.sprites.draw(ctx, HC.art.sun, 70, 66 + HC.art.sun.h / 2, 'glow');
  HC.font.draw(ctx, 'HOLLOWCROWN', 250, 30, '#ffd650', { align: 'center', scale: 3, shadow: '#5a3a10' });
  HC.font.draw(ctx, 'A PRINCESS OF LIGHT. A CASTLE THAT FORGOT THE SUN.', 250, 60, '#f0dcb0', { align: 'center', shadow: '#1a0c10' });
  eyes(ctx, [[300, 146], [452, 140], [180, 147]]);
}
// ---- cover 315x250 (shown at 630x500) ----
{
  const c = document.getElementById('cover'), ctx = c.getContext('2d'), W = 315, H = 250;
  sky(ctx, W, H, 200);
  glow(ctx, W / 2, 50, 110, W, H);
  clouds(ctx, W, [[70, 120, 70, 6], [250, 112, 70, 6], [160, 140, 90, 5]], W / 2, 50);
  castle(ctx, W, 218, 0.78, 5);
  ground(ctx, W, H, 214);
  HC.sprites.draw(ctx, HC.art.sun, W / 2, 50 + HC.art.sun.h / 2, 'glow');
  HC.font.draw(ctx, 'HOLLOWCROWN', W / 2, 92, '#ffd650', { align: 'center', scale: 2, shadow: '#5a3a10' });
  motes(ctx, W / 2, 210, 26, 40, 9);
  princess(ctx, W / 2, 238, 2);
  eyes(ctx, [[40, 224], [266, 220], [92, 232]]);
}
// ---- background tile 96x96: dark castle bricks ----
{
  const c = document.getElementById('bg'), ctx = c.getContext('2d');
  for (let y = 0; y < 96; y++) for (let x = 0; x < 96; x++) {
    const row = Math.floor(y / 8), off = row & 1 ? 8 : 0, rx = (x + off) % 16, ry = y % 8;
    const r = HC.makeRng(Math.floor((x + off) / 16) * 31 + row * 7)();
    let col = HC.hex('#130d1e').map((v) => v * (0.85 + r * 0.25));
    if (ry === 7 || rx === 15) col = HC.hex('#08050d');
    else if (ry === 0) col = HC.hex('#1c142a');
    ctx.fillStyle = HC.rgb(col); ctx.fillRect(x, y, 1, 1);
  }
}
</script></body></html>
